<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{ theme.logo_text }} — Admin Login</title>
<link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png">
<link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#{{ theme.primary }};--accent:#{{ theme.accent }};--dark:#{{ theme.dark }};
  --serif:'Cormorant Garamond','Playfair Display',Georgia,serif;
  --gold:linear-gradient(135deg,#F3D3A6 0%,var(--accent) 45%,color-mix(in srgb,var(--primary) 80%,#000) 100%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'{{ theme.font }}','Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#3A2F27;
  background:radial-gradient(800px 500px at 80% 0%,rgba(255,248,236,.95),transparent 60%),radial-gradient(600px 500px at 0% 100%,rgba(150,115,80,.35),transparent 60%),linear-gradient(160deg,#EFE6DA,#D3C2AD)}
.stage{perspective:1200px}
.card{background:rgba(255,255,255,.5);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid rgba(255,255,255,.7);padding:2.6rem 2.4rem;border-radius:26px;width:100%;max-width:390px;text-align:center;
  box-shadow:0 40px 80px -30px rgba(60,40,20,.55),0 2px 8px rgba(60,40,20,.08);animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotateX(2deg)}50%{transform:translateY(-8px) rotateX(0)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.logo{width:84px;height:84px;margin-bottom:.6rem;filter:drop-shadow(0 14px 18px rgba(60,40,20,.45))}
h1{font-family:var(--serif);font-size:2.2rem;font-weight:600;color:var(--dark);line-height:1.1}
h1 span{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#8C7B6A;font-size:.7rem;letter-spacing:3px;text-transform:uppercase;margin:.3rem 0 1.9rem}
.fg{margin-bottom:1.1rem;text-align:left}
.fg label{display:block;margin-bottom:.35rem;font-weight:600;color:#3A2F27;font-size:.84rem}
.fg input{width:100%;padding:.85rem .9rem;border:1px solid color-mix(in srgb,var(--primary) 25%,#fff);border-radius:12px;font-size:.95rem;outline:none;transition:.2s;background:rgba(255,255,255,.75);color:#3A2F27}
.fg input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent);background:#fff}
.btn{width:100%;padding:.95rem;background:var(--gold);color:var(--dark);border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:1px;transition:.2s;margin-top:.4rem;
  box-shadow:0 12px 24px -12px color-mix(in srgb,var(--primary) 90%,transparent)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.err{background:#F3DAD3;border:1px solid #E8C2B7;color:#7E2E20;padding:.8rem;border-radius:10px;margin-bottom:1rem;display:none;font-size:.87rem}
.err.show{display:block}
.kiosk-link{display:inline-block;margin-top:1.3rem;color:color-mix(in srgb,var(--primary) 85%,#000);font-size:.85rem;text-decoration:none;font-weight:600}
.kiosk-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="stage"><div class="card">
  <img src="/static/images/brand/shiftguard-mark.svg" class="logo" alt="">
  <h1>{% if theme.logo_text == 'ShiftGuard' %}Shift<span>Guard</span>{% else %}{{ theme.logo_text }}{% endif %}</h1>
  <p class="sub">Admin Dashboard</p>
  <div class="err" id="err"></div>
  <form id="frm">
    <div class="fg"><label>Username</label><input type="text" id="u" placeholder="admin" autofocus></div>
    <div class="fg"><label>Password</label><input type="password" id="p" placeholder="••••••••"></div>
    <button type="submit" class="btn">Login →</button>
  </form>
  <a href="/kiosk" class="kiosk-link">→ Go to Kiosk</a>
</div></div>
<script>
document.getElementById('frm').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err');err.classList.remove('show');
  const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('u').value.trim(),
                         password:document.getElementById('p').value})});
  const d=await r.json();
  if(d.success)window.location.href='/admin';
  else{err.textContent=d.message||'Invalid credentials';err.classList.add('show');}
});
</script>
</body>
</html>
