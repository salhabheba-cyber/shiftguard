<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset your password — ShiftGuard</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,700;0,800&display=swap" rel="stylesheet">
<style>
:root{--o:#FF6A00;--o2:#FF8A1F;--b:#2563EB;--ink:#050B1F;--txt:#E6ECF8;--mut:#93A4C8;--line:rgba(96,140,255,.18);
  --og:linear-gradient(135deg,#FFA24A 0%,#FF6A00 55%,#E2520A 100%);
  --display:'Poppins',Inter,'Segoe UI',Arial,sans-serif;--sans:Inter,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--txt);background:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:410px;padding:2.3rem 2.1rem;border-radius:26px;text-align:center;
  background:rgba(10,22,51,.92);border:1px solid rgba(96,140,255,.3);box-shadow:0 50px 100px -30px rgba(0,0,0,.85)}
.card img{width:54px;height:54px;margin:0 auto .5rem}
h1{font:800 italic 1.6rem var(--display);color:#fff;letter-spacing:-.5px}
h1 span{color:var(--o)}
.sub{color:var(--mut);font-size:.85rem;margin:.3rem 0 1.4rem}
.fg{text-align:left;margin-bottom:1rem}
.fg label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.35rem;color:#C9D4EC}
.fg input{width:100%;padding:.85rem .95rem;border-radius:12px;border:1px solid rgba(147,164,200,.25);background:rgba(255,255,255,.05);font-size:.98rem;color:#fff;outline:none}
.fg input:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(255,106,0,.2)}
.go{width:100%;margin-top:.35rem;padding:.95rem;border:none;border-radius:12px;cursor:pointer;background:var(--og);color:#fff;font:700 1rem var(--sans);box-shadow:0 14px 28px -12px rgba(255,106,0,.85)}
.go:disabled{opacity:.6;cursor:wait}
.err{display:none;margin-bottom:1rem;padding:.75rem;border-radius:10px;background:rgba(220,38,38,.15);border:1px solid rgba(248,113,113,.4);color:#FECACA;font-size:.87rem}
.err.show{display:block}
.ok-msg{padding:1rem;border-radius:12px;background:rgba(34,197,94,.14);border:1px solid rgba(74,222,128,.35);color:#BBF7D0;font-size:.92rem;margin-bottom:1rem}
a.home{display:inline-block;margin-top:1.2rem;color:var(--o2);font-size:.85rem;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <img src="/static/images/brand/shiftguard-mark.svg" alt="">
  <h1>Shift<span>Guard</span></h1>
  <p class="sub">Set a new password</p>
  <div class="err" id="err" role="alert"></div>
  <div id="form-wrap">
    <form id="frm" novalidate>
      <div class="fg"><label for="pw">New password</label>
        <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" required></div>
      <div class="fg"><label for="pw2">Confirm new password</label>
        <input id="pw2" type="password" autocomplete="new-password" required></div>
      <button class="go" type="submit" id="go">Reset Password</button>
    </form>
  </div>
  <div id="ok-wrap" hidden>
    <div class="ok-msg" id="ok-msg"></div>
    <a class="home" href="/?signin=1">Go to sign in →</a>
  </div>
</div>
<script>
var token = {{ token|tojson }};
var err = document.getElementById('err'), go = document.getElementById('go');
if (!token) { err.textContent = 'This reset link is missing its token.'; err.classList.add('show'); }
document.getElementById('frm').addEventListener('submit', async function(e){
  e.preventDefault(); err.classList.remove('show');
  var pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
  if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters'; err.classList.add('show'); return; }
  if (pw !== pw2) { err.textContent = 'Passwords do not match'; err.classList.add('show'); return; }
  go.disabled = true; go.textContent = 'Saving…';
  try {
    var r = await fetch('/api/auth/reset-password', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token: token, password: pw})});
    var d = await r.json();
    if (d.success) {
      document.getElementById('form-wrap').hidden = true;
      document.getElementById('ok-wrap').hidden = false;
      document.getElementById('ok-msg').textContent = d.message;
    } else { err.textContent = d.message || 'Could not reset password'; err.classList.add('show'); }
  } catch (_) { err.textContent = 'Could not reach the server. Try again.'; err.classList.add('show'); }
  go.disabled = false; go.textContent = 'Reset Password';
});
</script>
</body>
</html>
