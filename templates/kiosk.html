<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>{{ theme.logo_text }} — Attendance</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#00A8A8">
<style>
  :root{
    --primary:#{{ theme.primary }};
    --secondary:#{{ theme.secondary }};
    --accent:#{{ theme.accent }};
    --dark:#{{ theme.dark }};
    --text:#{{ theme.text }};
    --font:'{{ theme.font }}','Segoe UI',sans-serif;
  }
  body{font-family:var(--font){% if theme.dark_mode == '1' %};filter:invert(1) hue-rotate(180deg){% endif %}}
  .signin-input{width:100%;padding:.85rem 1rem;font-size:1.05rem;border:1px solid #cfd8dc;
    border-radius:10px;margin-top:.7rem;box-sizing:border-box}
  .pw-wrap{position:relative}
  .pw-wrap .signin-input{padding-right:2.8rem}
  .pw-eye{position:absolute;right:.6rem;top:calc(50% + .35rem);transform:translateY(-50%);
    cursor:pointer;background:none;border:none;font-size:1.2rem;line-height:1;padding:.2rem;color:#78909c}
</style>
</head>
<body>
<div class="kiosk-wrap">

  <!-- HEADER -->
  <header class="kiosk-header">
    <img src="{{ theme.logo_url or '/static/images/myspa_logo.jpg' }}" class="kiosk-logo" onerror="this.style.display='none'" alt="Logo">
    <h1>{{ theme.logo_text }}</h1>
    <div class="kiosk-sub">Employee Attendance System</div>
    <div class="kiosk-clock" id="clock">00:00:00</div>
    <div style="font-size:.8rem;color:#78909c;margin-top:.2rem">{{ today }}</div>
  </header>

  <main class="kiosk-main">

    <div class="stat-card">
      <div class="stat-num" id="cnt">{{ checked_in_count }}</div>
      <div class="stat-lbl">Employees Checked In</div>
    </div>

    <!-- STEP 0: SIGN IN GATE -->
    <div class="kiosk-card" id="s-gate">
      <h2>Welcome</h2>
      <button class="btn-action btn-checkin" style="width:100%" onclick="show('s-gate',false);show('s-signin',true)">🔐 Sign In</button>
    </div>

    <!-- STEP 1: SIGN IN (username + PIN) -->
    <div class="kiosk-card" id="s-signin" style="display:none">
      <h2>Sign In</h2>
      <input type="text" id="si-user" class="signin-input" placeholder="Username"
             autocomplete="off" autocorrect="off" autocapitalize="off">
      <div class="pw-wrap">
        <input type="password" id="si-pin" class="signin-input" maxlength="4" inputmode="numeric"
               placeholder="4-digit PIN" autocomplete="off">
        <button type="button" class="pw-eye" onclick="togglePin()" aria-label="Show PIN">👁</button>
      </div>
      <button class="btn-action btn-checkin" style="width:100%;margin-top:.8rem" onclick="doSignIn()">Sign In</button>
    </div>

    <!-- STEP 2: ACTION -->
    <div class="kiosk-card" id="s-action" style="display:none">
      <div class="sel-emp">
        <div class="sel-name" id="sel-name"></div>
        <div class="sel-shift" id="sel-shift"></div>
      </div>
      <h2>What would you like to do?</h2>
      <div class="action-btns">
        <button class="btn-action btn-checkin" onclick="chooseAction('in')">🌸 Check In</button>
        <button class="btn-action btn-checkout" onclick="chooseAction('out')">👋 Check Out</button>
      </div>
    </div>

    <!-- STEP 3: CAMERA -->
    <div class="kiosk-card" id="s-camera" style="display:none">
      <div class="camera-section">
        <div class="camera-label" id="cam-label">📸 Smile! Photo in...</div>
        <div class="countdown" id="countdown" style="display:none"></div>
        <video id="cam-preview" autoplay playsinline muted></video>
        <canvas id="cam-canvas" width="320" height="240"></canvas>
        <div id="cam-err" class="camera-err" style="display:none">
          ⚠️ Camera unavailable. Proceeding without photo.
          <br><button class="btn btn-primary" style="margin-top:.5rem" onclick="skipCamera()">Continue →</button>
        </div>
      </div>
    </div>

    <!-- STEP 4: RESULT -->
    <div id="s-result" style="display:none;width:100%;max-width:480px">
      <div class="result-box" id="result-box">
        <div class="result-emoji" id="r-emoji">🌸</div>
        <div class="result-text" id="r-text"></div>
        <div class="result-time" id="r-time"></div>
        <img id="r-photo" class="result-photo" style="display:none" alt="Your photo">
      </div>
    </div>

    <div id="inline-err" class="inline-err"></div>

  </main>

  <footer class="kiosk-footer">
    <button class="btn-back" onclick="reset()">← Back</button>
    <div class="footer-info">
      <span>{{ theme.logo_text }}</span>
      <span class="online-dot">● Online</span>
    </div>
  </footer>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <span class="lightbox-close">×</span>
  <img id="lb-img" src="" alt="">
</div>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
let selId=null, selName='', action=null, pin='';
let camStream=null, capturedPhoto=null;

// ── CLOCK ────────────────────────────────────────────────────────────────────
function tick(){
  const n=new Date();
  document.getElementById('clock').textContent=
    String(n.getHours()).padStart(2,'0')+':'+
    String(n.getMinutes()).padStart(2,'0')+':'+
    String(n.getSeconds()).padStart(2,'0');
}
setInterval(tick,1000); tick();

// ── STATUS REFRESH ───────────────────────────────────────────────────────────
async function refreshCnt(){
  try{
    const r=await fetch('/api/kiosk/status');
    const d=await r.json();
    document.getElementById('cnt').textContent=d.checked_in_count;
  }catch(e){}
}
setInterval(refreshCnt,10000);

// ── SIGN IN ──────────────────────────────────────────────────────────────────
function togglePin(){
  const inp=document.getElementById('si-pin');
  const btn=document.querySelector('.pw-eye');
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  if(btn){btn.textContent=show?'🙈':'👁';btn.setAttribute('aria-label',show?'Hide PIN':'Show PIN');}
}
async function doSignIn(){
  const username=document.getElementById('si-user').value.trim();
  const p=document.getElementById('si-pin').value.trim();
  if(!username||p.length!==4){showErr('Enter your username and 4-digit PIN.');return;}
  clearErr();
  try{
    const r=await fetch('/api/kiosk/signin',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,pin:p})
    });
    const d=await r.json();
    if(!d.success){showErr(d.message||'Invalid username or PIN.');return;}
    selId=d.employee.id; selName=d.employee.name; pin=p;
    document.getElementById('sel-name').textContent=selName;
    document.getElementById('sel-shift').textContent=
      (d.employee.position?d.employee.position+' · ':'')+d.employee.shift_start+' – '+d.employee.shift_end;
    document.getElementById('si-user').value=''; document.getElementById('si-pin').value='';
    show('s-signin',false); show('s-action',true);
  }catch(e){
    showErr('Network error. Please try again.');
  }
}

// ── ACTION ───────────────────────────────────────────────────────────────────
function chooseAction(a){
  action=a;
  show('s-action',false);
  startCamera();
}

// ── CAMERA ───────────────────────────────────────────────────────────────────
async function startCamera(){
  show('s-camera',true);
  document.getElementById('countdown').style.display='none';
  document.getElementById('cam-label').textContent='📸 Smile! Photo in...';
  document.getElementById('cam-err').style.display='none';
  capturedPhoto=null;

  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    const vid=document.getElementById('cam-preview');
    vid.srcObject=camStream;
    await vid.play();
    // Start countdown after 500ms (camera warms up)
    setTimeout(startCountdown, 500);
  }catch(err){
    console.warn('Camera error:',err);
    document.getElementById('cam-preview').style.display='none';
    document.getElementById('cam-err').style.display='block';
  }
}

function startCountdown(){
  const cdEl=document.getElementById('countdown');
  cdEl.style.display='block';
  document.getElementById('cam-label').textContent='📸 Look at the camera!';
  let count=3;
  cdEl.textContent=count;
  const iv=setInterval(()=>{
    count--;
    if(count>0){cdEl.textContent=count;}
    else{clearInterval(iv);capturePhoto();}
  },1000);
}

function capturePhoto(){
  const vid=document.getElementById('cam-preview');
  const canvas=document.getElementById('cam-canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=vid.videoWidth||320;
  canvas.height=vid.videoHeight||240;
  ctx.drawImage(vid,0,0,canvas.width,canvas.height);
  capturedPhoto=canvas.toDataURL('image/jpeg',0.85);
  stopCamera();
  document.getElementById('countdown').style.display='none';
  document.getElementById('cam-label').textContent='✅ Photo taken!';
  // Show preview briefly then submit
  setTimeout(()=>doCheckInOut('ok'),600);
}

function skipCamera(){
  stopCamera();
  doCheckInOut('no_camera');
}

function stopCamera(){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
}

// ── SUBMIT ───────────────────────────────────────────────────────────────────
async function doCheckInOut(photoStatus){
  const endpoint=action==='in'?'/api/kiosk/checkin':'/api/kiosk/checkout';
  try{
    const r=await fetch(endpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        employee_id:selId,
        pin:pin,
        photo:capturedPhoto||null,
        photo_status:photoStatus
      })
    });
    const d=await r.json();
    show('s-camera',false);
    if(d.success){
      document.getElementById('r-emoji').textContent=action==='in'?'🌸':'👋';
      document.getElementById('r-text').textContent=d.message;
      document.getElementById('r-time').textContent='Time: '+d.time;
      const ph=document.getElementById('r-photo');
      if(d.photo_path){ph.src=d.photo_path;ph.style.display='block';}
      else ph.style.display='none';
      document.getElementById('result-box').style.background=
        action==='in'?'linear-gradient(135deg,#27ae60,#1e8449)':
                       'linear-gradient(135deg,#00A8A8,#1a8a8e)';
      show('s-result',true);
      refreshCnt();
      setTimeout(reset,5000);
    }else{
      showErr(d.message||'Error. Try again.');
      show('s-action',true);
    }
  }catch(e){
    show('s-camera',false);
    showErr('Network error. Please try again.');
    show('s-action',true);
  }
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function show(id,v){const el=document.getElementById(id);if(el)el.style.display=v?'block':'none';}
function showErr(m){const el=document.getElementById('inline-err');el.textContent=m;el.style.display='block';}
function clearErr(){const el=document.getElementById('inline-err');el.style.display='none';}

function reset(){
  stopCamera();
  selId=null;selName='';action=null;pin='';capturedPhoto=null;
  show('s-gate',true);show('s-signin',false);show('s-action',false);
  show('s-camera',false);show('s-result',false);
  clearErr();
  document.getElementById('si-user').value='';
  const pinInp=document.getElementById('si-pin');pinInp.value='';pinInp.type='password';
  const eyeBtn=document.querySelector('.pw-eye');if(eyeBtn){eyeBtn.textContent='👁';eyeBtn.setAttribute('aria-label','Show PIN');}
  document.getElementById('cam-preview').style.display='block';
}

// Auto-reset on inactivity
let timer;
function rTimer(){clearTimeout(timer);timer=setTimeout(reset,30000);}
document.addEventListener('click',rTimer);document.addEventListener('touchstart',rTimer);rTimer();

// PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
}
</script>
</body>
</html>
