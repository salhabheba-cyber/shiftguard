<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" role="img" aria-label="ShiftGuard">
  <g>
  <defs>
    <linearGradient id="sgo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B7FFF"/><stop offset="1" stop-color="#2E22A8"/>
    </linearGradient>
    <linearGradient id="sgb" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B5BFF"/><stop offset="1" stop-color="#1B2E8C"/>
    </linearGradient>
    <linearGradient id="sgm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E22A8"/><stop offset=".55" stop-color="#8B7FFF"/><stop offset="1" stop-color="#3B5BFF"/>
    </linearGradient>
  </defs>
  <!-- speed lines -->
