  <path d="M36 43.2 L72 52.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".95"/>
</g>
  <text x="104" y="68" font-family="Poppins,Montserrat,'Segoe UI',Arial,sans-serif" font-size="50" font-weight="800" font-style="italic" letter-spacing="-1"><tspan fill="#FFFFFF">Shift</tspan><tspan fill="#5B4FE8">Guard</tspan></text>
</svg>
